let theme='experimental',page='profile',tab='Рекомендации',filter='Все',focus=0,query='',saved=new Set([0,2,5]),planned=new Set([3,7]),watched=new Set([0,1,2,4,5,6]),recs=new Map([0,1,2,3,4,5,6,7].map(i=>[i,films[i].desc])),ratings=new Map([0,1,2,4,5,6].map(i=>[i,{scores:[films[i].rate,...Array(7).fill(null)],emotions:[],comment:''}])),draft=null,current=null,toastTimer,hoverTimer;

function total(scores){if(scores[0]==null)return null;let rest=scores.slice(1).filter(v=>v!==null);let n=rest.length?(scores[0]+rest.reduce((a,b)=>a+b,0)/rest.length)/2:scores[0];return Math.round((n+Number.EPSILON)*10)/10}
function rating(i){return ratings.has(i)?total(ratings.get(i).scores):null}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('on'),2300)}
function nav(){return `<header class="nav"><div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span>filmoteka<span style="color:var(--accent)">.</span></div><div class="navlinks">${[['catalog','Каталог'],['profile','Мой профиль'],['library','Библиотека']].map(([p,n])=>`<button data-page="${p}" class="${page===p?'on':''}">${n}</button>`).join('')}</div><div class="navright"><button class="iconbutton" data-action="search" aria-label="Поиск">${svg('search')}</button><button class="avatar" data-page="profile" aria-label="Профиль">F</button></div></header>`}
function hero(){return `<section class="hero ${customBackground?'custom-background':''}" id="hero"><div class="hero-back"><div class="base-scene ${customBackground?'photo':'default-art'}" ${customBackground?`style="background-image:url('${customBackground}')"`:''}></div></div><div class="hero-title"><div class="profile-row"><div class="avatar large">F</div><div class="identity"><div class="name-row"><h1>Filmlover</h1><button class="share-icon" data-action="share" title="Поделиться профилем" aria-label="Поделиться профилем">${svg('share',19)}</button></div><small>@filmlover</small></div></div></div><div class="scene-control"><button class="scene-edit" data-action="edit-bg" title="Загрузить фон профиля" aria-label="Загрузить фон профиля"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 6-5 4 4 3-3 5 4"/></svg></button>${customBackground?'<button class="scene-edit" data-action="reset-bg" title="Сбросить свой фон" aria-label="Сбросить свой фон">×</button>':''}<input type="file" id="background-file" accept="image/png,image/jpeg,image/webp" hidden></div></section>`}
function indices(){let ix=films.map((_,i)=>i);if(page!=='catalog'){if(tab==='Рекомендации')ix=ix.filter(i=>recs.has(i));if(tab==='Оценённые')ix=ix.filter(i=>ratings.has(i));if(tab==='Избранное')ix=ix.filter(i=>saved.has(i));if(tab==='Хочу посмотреть')ix=ix.filter(i=>planned.has(i));if(tab==='Просмотрено')ix=ix.filter(i=>watched.has(i))}if(filter!=='Все')ix=ix.filter(i=>films[i].type===filter);if(query)ix=ix.filter(i=>(films[i].name+' '+films[i].en).toLowerCase().includes(query.toLowerCase()));return ix}
function cards(){return indices().map((i,j)=>{let f=films[i],r=rating(i);return `<article tabindex="0" class="film" data-film="${i}" style="--i:${j}" aria-label="Открыть ${esc(f.name)}"><div class="cover"><div class="art" style="background-image:url('${ART[i]}')"></div><div class="card-glint"></div>${r===null?'':`<span class="rating">${fmt(r)}</span>`}<div class="art-text"><small>${esc(f.en)}</small><strong>${esc(f.name)}</strong></div><div class="quick-actions"><button data-open="${i}">${svg('arrow',13)} ${r===null?'Оценить':'Открыть'}</button><button data-planquick="${i}" aria-label="Хочу посмотреть" aria-pressed="${planned.has(i)}" class="${planned.has(i)?'on':''}">${svg('bookmark',15)}</button><button data-heart="${i}" aria-label="Избранное" aria-pressed="${saved.has(i)}" class="${saved.has(i)?'on':''}">${svg('heart',15)}</button></div></div><div class="film-info"><div><h3>${esc(f.name)}</h3><div class="meta">${f.year} · ${f.type}</div></div><button class="heart ${saved.has(i)?'saved':''}" data-heart="${i}" aria-label="Избранное" aria-pressed="${saved.has(i)}">${svg('heart',18)}</button></div>${tab==='Рекомендации'&&page!=='catalog'?`<p class="description">${esc(recs.get(i))}</p>`:''}</article>`}).join('')||'<p class="empty">Здесь пока нет произведений.</p>'}
function section(){const title=page==='catalog'?'Каталог':tab==='Рекомендации'?'Советую посмотреть':tab==='Оценённые'?'Мои оценки':tab;return `<section class="content" id="collection"><div class="section-head"><div><h2>${title}</h2><p>${indices().length} ${indices().length===1?'произведение':indices().length>=2&&indices().length<=4?'произведения':'произведений'}</p></div><div class="filter">${types.map((x,i)=>`<button data-filter="${x}" class="${filter===x?'on':''}">${typeLabels[i]}</button>`).join('')}</div></div><div class="film-grid" id="grid">${cards()}</div><p class="art-credit">Демонстрационные данные и иллюстрации · не официальные постеры</p></section>`}
function positionTab(){let bar=$('.profiletabs'),active=bar?.querySelector('button.on'),indicator=bar?.querySelector('.tab-indicator');if(active&&indicator){indicator.style.width=active.offsetWidth+'px';indicator.style.transform=`translateX(${active.offsetLeft}px)`}}
function render(){shell.className='wrap '+(page==='catalog'?'catalog':'');shell.innerHTML=nav()+`<div class="searchbox ${page==='catalog'?'on':''}"><input type="search" id="q" placeholder="Название фильма, сериала или аниме" aria-label="Поиск произведения" value="${esc(query)}"></div>`+(page==='catalog'?'':hero())+`<div class="profiletabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'on':''}">${t}</button>`).join('')}<span class="tab-indicator"></span></div>`+section()+`<footer class="footer"><strong>Filmoteka.</strong><span>Свет 04+ · утверждённый визуальный образец</span></footer>`;positionTab();focus=-1;app.style.setProperty('--scene-color','#d7c2f0')}
function changeFocus(i){if(page==='catalog')return;focus=i;const card=document.querySelector(`[data-film="${i}"]`);card?.style.setProperty('--card-light',colors[i])}
function restoreBackground(){focus=-1}
function updateSection(){let old=$('#collection');if(old)old.outerHTML=section();document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('on',x.dataset.tab===tab);x.setAttribute('aria-selected',String(x.dataset.tab===tab))});positionTab()}
function criterion(i){const v=draft.scores[i];return `<div class="criterion ${i===0?'main-criterion':''} ${v===null?'unset':''}" data-criterion="${i}"><label for="criterion-${i}"><span>${criteria[i]}</span><output>${v===null?'Не оценено':fmt(v)+'/10'}</output></label><div class="range-row"><input type="range" min="0" max="10" step="0.1" id="criterion-${i}" data-score="${i}" value="${v??5}" aria-label="${criteria[i]}"><button type="button" data-setscore="${i}" title="${v===null?'Установить значение':'Очистить критерий'}">${v===null?'+':'×'}</button></div></div>`}
function openFilm(i){current=i;let f=films[i],old=ratings.get(i);draft={scores:old?[...old.scores]:Array(8).fill(null),emotions:new Set(old?.emotions||[]),comment:old?.comment||'',rec:recs.get(i)||''};let dlg=$('#dialog');dlg.innerHTML=`<div class="modal"><button class="close" data-action="close" aria-label="Закрыть">${svg('close')}</button><div class="modal-art" style="background-image:url('${ART[i]}')"></div><div class="modal-body"><div class="eyebrow">${f.type} · ${f.year}</div><h2>${esc(f.name)}</h2><div class="modal-controls"><button class="secondary ${saved.has(i)?'on':''}" data-toggle="fav">${svg('heart',16)} <span>${saved.has(i)?'В избранном':'В избранное'}</span></button><button class="secondary ${planned.has(i)?'on':''}" data-toggle="plan">${svg('bookmark',16)} <span>${planned.has(i)?'В планах':'Хочу посмотреть'}</span></button><button class="secondary ${watched.has(i)?'on':''}" data-toggle="watch">${svg('check',16)} <span>${watched.has(i)?'Просмотрено':'Отметить просмотр'}</span></button></div><div class="modal-rating"><div class="scoreboard"><div><h3>Моя оценка</h3><div class="meta" id="score-help"></div></div><div class="score-value"><span id="score">${fmt(total(draft.scores))}</span><small> / 10</small></div></div><div class="criteria">${criteria.map((_,i)=>criterion(i)).join('')}</div><label class="form-label">Какие эмоции я испытал?</label><div class="emotion-list">${emotions.map(e=>`<button class="emotion ${draft.emotions.has(e)?'on':''}" data-emotion="${e}" aria-pressed="${draft.emotions.has(e)}">${e}</button>`).join('')}</div><label for="comment" class="form-label">Комментарий</label><textarea id="comment" placeholder="Что запомнилось после просмотра?">${esc(draft.comment)}</textarea><div class="modal-actions"><button class="primary" data-action="save-rating" id="save-rating">Сохранить оценку</button><span class="meta">Эмоции и комментарий не влияют на балл.</span></div><div class="rec-box"><label for="recommendation" class="form-label">Рекомендация</label><textarea id="recommendation" placeholder="Почему ты советуешь это произведение?">${esc(draft.rec)}</textarea><div class="modal-actions"><button class="secondary" data-action="save-rec">${recs.has(i)?'Обновить рекомендацию':'Порекомендовать'}</button>${recs.has(i)?'<button class="secondary" data-action="delete-rec">Убрать рекомендацию</button>':''}</div></div></div></div></div>`;refreshScore();dlg.classList.add('open');document.body.style.overflow='hidden';dlg.querySelector('.close').focus()}
function refreshScore(){let n=draft.scores.slice(1).filter(v=>v!==null).length;$('#score').textContent=fmt(total(draft.scores));$('#score-help').textContent=draft.scores[0]===null?'Сначала укажи общее впечатление':n?`50% общее впечатление + 50% среднее (${n} из 7 критериев)`:'Только общее впечатление · дополнительные критерии необязательны';$('#save-rating').disabled=draft.scores[0]===null}

function toggleSet(set,i){set.has(i)?set.delete(i):set.add(i);return set.has(i)}
async function share(){const demo='/u/filmlover';try{await navigator.clipboard.writeText(demo);toast('Скопирован демонстрационный путь: '+demo)}catch{toast('Демонстрационный путь: '+demo+' · сервер не подключён')}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(b){let d=b.dataset;if(d.theme){theme=d.theme;app.dataset.theme=theme;document.querySelectorAll('.lab-tabs button').forEach(x=>x.classList.toggle('active',x===b));render();return}if(d.page){page=d.page;filter='Все';query='';if(page==='library')tab='Оценённые';if(page==='profile')tab='Рекомендации';render();return}if(d.tab){tab=d.tab;filter='Все';updateSection();return}if(d.filter){filter=d.filter;updateSection();return}if(d.open!==undefined){openFilm(+d.open);return}if(d.heart!==undefined||d.planquick!==undefined){let fav=d.heart!==undefined,i=+(fav?d.heart:d.planquick),on=toggleSet(fav?saved:planned,i);updateSection();toast(on?(fav?'Добавлено в избранное':'Добавлено в планы'):'Удалено из списка');return}if(d.toggle){let set={fav:saved,plan:planned,watch:watched}[d.toggle],on=toggleSet(set,current);b.classList.toggle('on',on);b.querySelector('span').textContent={fav:on?'В избранном':'В избранное',plan:on?'В планах':'Хочу посмотреть',watch:on?'Просмотрено':'Отметить просмотр'}[d.toggle];return}if(d.setscore!==undefined){let i=+d.setscore;changeScore(i,draft.scores[i]===null?Number($(`#criterion-${i}`).value):null);return}if(d.emotion){toggleSet(draft.emotions,d.emotion);b.classList.toggle('on',draft.emotions.has(d.emotion));b.setAttribute('aria-pressed',String(draft.emotions.has(d.emotion)));return}if(d.action==='save-rating'){if(draft.scores[0]===null)return;ratings.set(current,{scores:[...draft.scores],emotions:[...draft.emotions],comment:$('#comment').value});closeFilm();toast('Оценка сохранена в прототипе');return}if(d.action==='save-rec'){recs.set(current,$('#recommendation').value);closeFilm();toast('Рекомендация сохранена в прототипе');return}if(d.action==='delete-rec'){recs.delete(current);closeFilm();toast('Рекомендация удалена');return}if(d.action==='share'){share();return}if(d.action==='edit-bg'){$('#background-file').click();return}if(d.action==='reset-bg'){customBackground='';render();return}if(d.action==='search'){page='catalog';filter='Все';query='';render();$('#q').focus();return}if(d.action==='close'){closeFilm();return}}
let f=e.target.closest('[data-film]');if(f)openFilm(+f.dataset.film);if(e.target===$('#dialog'))closeFilm()});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='q'){query=t.value;updateSection()}if(t.dataset.score!==undefined)changeScore(+t.dataset.score,Number(t.value));if(t.id==='motion'){document.body.classList.toggle('no-motion',!t.checked);clearTimeout(hoverTimer);clearTimeout(restoreTimer);restoreBackground()}});
document.addEventListener('change',e=>{if(e.target.id!=='background-file')return;let f=e.target.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>15*1024*1024){toast('Выбери PNG, JPEG или WebP до 15 МБ');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{customBackground=String(reader.result);render();toast('Фон изменён в текущей сессии')};img.onerror=()=>toast('Не удалось прочитать изображение');img.src=String(reader.result)};reader.readAsDataURL(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#dialog').classList.contains('open'))closeFilm();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-film]')){e.preventDefault();openFilm(+e.target.dataset.film)}});
document.addEventListener('pointerover',e=>{let f=e.target.closest('[data-film]');if(!f||page==='catalog'||e.pointerType==='touch'||reduced()||f.contains(e.relatedTarget))return;clearTimeout(hoverTimer);clearTimeout(restoreTimer);hoverTimer=setTimeout(()=>changeFocus(+f.dataset.film),theme==='experimental'?110:200)});
document.addEventListener('pointerout',e=>{let f=e.target.closest('[data-film]');if(!f||f.contains(e.relatedTarget))return;clearTimeout(hoverTimer);clearTimeout(restoreTimer);restoreTimer=setTimeout(restoreBackground,theme==='experimental'?480:320);let c=f.querySelector('.cover');['--rx','--ry','--ax','--ay'].forEach(p=>c.style.removeProperty(p));});
document.addEventListener('pointermove',e=>{let c=e.target.closest('.cover');if(!c||reduced()||e.pointerType==='touch'||page==='catalog')return;let r=c.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),m=theme==='depth'?1.5:theme==='scope'||theme==='iris'?.55:1;c.style.setProperty('--rx',(0.5-y)*8*m+'deg');c.style.setProperty('--ry',(x-.5)*9*m+'deg');c.style.setProperty('--ax',(x-.5)*-8+'px');c.style.setProperty('--ay',(y-.5)*-8+'px');c.style.setProperty('--px',x*100+'%');c.style.setProperty('--py',y*100+'%')});
document.addEventListener('focusin',e=>{let f=e.target.closest('[data-film]');if(f&&page!=='catalog'&&!reduced())changeFocus(+f.dataset.film)});document.addEventListener('focusout',e=>{let f=e.target.closest('[data-film]');if(f&&!f.contains(e.relatedTarget)){clearTimeout(restoreTimer);restoreTimer=setTimeout(restoreBackground,320)}});window.addEventListener('resize',positionTab);render();
</script></body></html>
