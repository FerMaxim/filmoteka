# Replace __SERVER_IP__ locally; never commit private connection coordinates.
server {
    listen 443 ssl;
    server_name __SERVER_IP__;
    ssl_certificate /etc/filmoteka/tls/server.crt;
    ssl_certificate_key /etc/filmoteka/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FilmotekaTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 5m;
    access_log off;
    error_log /var/log/nginx/filmoteka-error.log warn;
    if ($host != '__SERVER_IP__') { return 444; }

    location /static/ {
        alias /srv/filmoteka/shared/static/;
        access_log off;
    }
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
}
