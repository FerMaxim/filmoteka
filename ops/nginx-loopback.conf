# Preparation only. Public HTTPS ingress requires a domain and network handoff.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 5m;
    access_log off;
    error_log /var/log/nginx/filmoteka-error.log warn;

    location /static/ {
        alias /srv/filmoteka/shared/static/;
        access_log off;
    }

    # Upload policy has not been implemented or approved for serving media.
    location /media/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
}
