[project]
name = "filmoteka"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<30",
  "whitenoise>=6,<7",
]

[dependency-groups]
dev = ["pytest", "pytest-django", "playwright", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["quick: fast checks that run without a database"]

[tool.ruff]
extend-exclude = [".tooling"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
