name: Filmoteka
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check.py docs
        env:
          FILMOTEKA_CHECK_REPORT: ${{ runner.temp }}/filmoteka-checks.log
      - name: Set up uv and package cache
        if: steps.scope.outputs.suite != 'docs'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.arch }}-py313
      - name: Install PostgreSQL 17
        if: steps.scope.outputs.suite != 'docs'
        run: |
          set -euo pipefail
          if [[ ! -x /usr/lib/postgresql/17/bin/postgres ]]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' \
              | sudo tee /etc/apt/sources.list.d/filmoteka-pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-common
            echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: Install locked dependencies and Playwright Chromium
        if: steps.scope.outputs.suite != 'docs'
        run: |
          uv sync --locked --python 3.13
          uv run --locked --no-sync python -m playwright install --with-deps --only-shell chromium
      - name: Run the full native suite
        if: steps.scope.outputs.suite != 'docs'
        env:
          FILMOTEKA_CHECK_REPORT: ${{ runner.temp }}/filmoteka-checks.log
        run: uv run --locked --no-sync python tools/check.py full
      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmoteka-checks
          path: ${{ runner.temp }}/filmoteka-checks.log
          retention-days: 7
          if-no-files-found: error
  quality-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: verify
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
