name: Filmoteka
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check.py docs
      - run: python3 tools/check.py full
        if: steps.scope.outputs.suite != 'docs'
  quality-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: verify
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
