name: Filmoteka
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_scope.py "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check.py docs
        env:
          FILMOTEKA_CHECK_REPORT: ${{ runner.temp }}/filmoteka-checks.log
      - name: Cache container dependencies
        if: steps.scope.outputs.suite != 'docs'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/filmoteka-buildkit
          key: ${{ runner.os }}-${{ runner.arch }}-filmoteka-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock', 'compose.ci.yaml') }}
      - name: Create the CI builder
        if: steps.scope.outputs.suite != 'docs'
        run: docker buildx create --driver docker-container --name filmoteka-ci --use
      - run: python3 tools/check.py full
        if: steps.scope.outputs.suite != 'docs'
        env:
          FILMOTEKA_CI_CACHE: ${{ runner.temp }}/filmoteka-buildkit
          FILMOTEKA_CHECK_REPORT: ${{ runner.temp }}/filmoteka-checks.log
      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmoteka-checks
          path: ${{ runner.temp }}/filmoteka-checks.log
          retention-days: 7
          if-no-files-found: ignore
  quality-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: verify
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.verify.result }}
